pcm.LineOut {
    type dmix # Kernel PCM
    ipc_key 1112233  # Any Unique Number Number
    slave {
        pcm "hw:USBAudio,0" # USB adapter, by name (id set in /etc/modprobe.d/alsa-base.conf)
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 44100
        #periods 128
     }
}

pcm.!default {
 type plug
 slave.pcm "hw:USBAudio,0"
}

# So plain alsamixer/amixer open the USB card, not card 0 (Headphones)
ctl.!default {
 type hw
 card USBAudio
}
 
ctl.equal {
  type equal
}
pcm.plugequal {
  type equal
  slave.pcm "plug:LineOut"
}
pcm.equal {
  type plug
  slave.pcm plugequal
}
